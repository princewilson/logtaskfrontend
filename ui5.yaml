specVersion: "3.1"
metadata:
  name: logtask
type: application
framework:
  name: OpenUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
    - name: sap.f
    - name: sap.uxap
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-serveframework
      afterMiddleware: compression
      configuration:
        saveLibsLocal: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
