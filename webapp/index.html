<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>UI5 TypeScript Walkthrough</title>
	<script async crossorigin="anonymous"
		data-clerk-publishable-key="pk_test_cmVzdGVkLXBoZWFzYW50LTcxLmNsZXJrLmFjY291bnRzLmRldiQ"
		src="https://rested-pheasant-71.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
		type="text/javascript">
		</script>
	<script>
		window.addEventListener('load', async () => {
			await Clerk.load();
			const checkStatus = () => {
				if (Clerk.status !== 'loading') {
					bootstrapUI5();
				} else {
					setTimeout(checkStatus, 100);
				}
			};
			checkStatus();
		});

		function bootstrapUI5() {
			const script = document.createElement('script');
			script.id = 'sap-ui-bootstrap';
			script.src = 'resources/sap-ui-core.js';
			script.setAttribute('data-sap-ui-theme', 'sap_horizon');
			script.setAttribute('data-sap-ui-compat-version', 'edge');
			script.setAttribute('data-sap-ui-async', 'true');
			script.setAttribute('data-sap-ui-on-init', 'module:sap/ui/core/ComponentSupport');
			script.setAttribute('data-sap-ui-resource-roots', '{"LogTask": "./"}');
			document.head.appendChild(script);
		}
	</script>
</head>

<body class="sapUiBody" id="content">
	<div data-sap-ui-component data-name="LogTask" data-id="container" data-settings='{"id" : "LogTask"}'></div>
</body>

</html>
